name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code skills/first-dollar/scripts/
      - run: npm run traces
      - name: Lint the gallery
        # The gallery is not a landing page, so the two rules that only apply to one
        # (a money ask and legal links) are skipped, the same way the eval scorer skips them.
        run: |
          if [ -d gallery ]; then (node skills/first-dollar/scripts/first-dollar-lint.mjs gallery --json || true) | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const f=JSON.parse(s).failures.filter(x=>!['commitment-cta','legal-links'].includes(x.rule));f.forEach(x=>console.log(x.file+':'+x.line,x.rule,x.message));process.exit(f.length?1:0)})"; fi
