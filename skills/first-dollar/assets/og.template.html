<!doctype html>
<!--
  Share card, 1200 x 630. Copy to og.html beside index.html.
  Fill every {{...}} from DESIGN.md tokens and COPY.md, then delete this comment.
  `grep -n "{{" og.html` must print nothing before you render.
  Render: node ${CLAUDE_SKILL_DIR}/scripts/first-dollar-check.mjs <dir> --og
  The headline is the Promise from COPY.md, three lines at most. If it runs
  longer, use the headline-lg size instead of headline-display.
  Add to the <head> of index.html (og:image must be an absolute URL):
    <meta property="og:title" content="{{product}}: {{promise}}">
    <meta property="og:description" content="{{ask}}. {{terms}}">
    <meta property="og:image" content="https://{{domain}}/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<meta name="robots" content="noindex">
<title>{{product}}</title>
{{font-link: the same font <link> tags index.html uses}}
<style>
  :root {
    --neutral: {{colors.neutral}};
    --ink: {{colors.ink}};
    --ink-muted: {{colors.ink-muted}};
    --line: {{colors.line}};
    --accent: {{colors.accent}};
  }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--neutral);
    color: var(--ink);
  }
  .card {
    box-sizing: border-box;
    width: 1200px;
    height: 630px;
    padding: 64px 80px 56px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 32px;
  }
  .name {
    margin: 0;
    font-family: "{{typography.body-lg.fontFamily}}", sans-serif;
    font-size: 28px;
    font-weight: {{typography.headline-md.fontWeight}};
  }
  .promise {
    margin: 0;
    align-self: center;
    max-width: 960px;
    font-family: "{{typography.headline-display.fontFamily}}", serif;
    font-size: {{typography.headline-display.fontSize}};
    font-weight: {{typography.headline-display.fontWeight}};
    line-height: {{typography.headline-display.lineHeight}};
    letter-spacing: {{typography.headline-display.letterSpacing}};
    text-wrap: balance;
  }
  .foot {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas: "ask domain" "terms domain";
    align-items: end;
    column-gap: 48px;
    row-gap: 4px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-family: "{{typography.body-lg.fontFamily}}", sans-serif;
    font-size: 26px;
  }
  .ask {
    grid-area: ask;
    margin: 0;
    color: var(--accent);
    font-weight: {{typography.headline-md.fontWeight}};
    font-variant-numeric: tabular-nums;
  }
  .terms,
  .domain {
    margin: 0;
    color: var(--ink-muted);
  }
  .terms {
    grid-area: terms;
  }
  .domain {
    grid-area: domain;
  }
</style>
</head>
<body>
  <main class="card">
    <p class="name">{{product}}</p>
    <h1 class="promise">{{promise}}</h1>
    <div class="foot">
      <p class="ask">{{ask, with the price, e.g. Pre-order for $39}}</p>
      <p class="terms">{{terms, e.g. Full refund until it ships}}</p>
      <p class="domain">{{domain}}</p>
    </div>
  </main>
</body>
</html>
