name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code skills/first-dollar/scripts/
      - run: npm run traces
      - name: Lint the gallery
        run: |
          if [ -d gallery ]; then node skills/first-dollar/scripts/first-dollar-lint.mjs gallery; fi
