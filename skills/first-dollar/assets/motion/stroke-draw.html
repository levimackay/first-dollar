<!--
  stroke-draw: a line drawing of the product that draws itself as it scrolls in.
  What it does: every stroke in the SVG traces in, scrubbed to scroll, in
  drafting order: the outline, then the seams and parts, then the dimensions,
  then the callout leaders, and each numbered note beside the drawing settles
  as its leader arrives. Runs on CSS scroll-driven animations; browsers
  without them get the same mapping from a small scroll handler.
  How to adapt: redraw the SVG from the real product (keep pathLength="1" on
  every .fd-stroke). Each stroke and note carries --a and --b, the slice of
  the scroll it draws in, as "cover" percentages: 0% is the figure's top at
  the bottom of the screen, 100% its bottom at the top. Keep the order
  structure, detail, dimensions, notes. Leave about a third of a screen of
  page below the figure so the drawing can finish. Real dimensions only, or
  keep the "examples" caption.
  Reduced motion: nothing is armed. The drawing is complete on first paint and
  every note is visible. Without JavaScript the same.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stroke draw</title>
<style>
:root {
  --fd-ground: #ecedea;
  --fd-ink: #15171a;
  --fd-accent: #0f6e55;
  --fd-font-display: serif;
  --fd-font-text: sans-serif;
  --fd-muted: color-mix(in srgb, var(--fd-ink) 68%, var(--fd-ground));
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fd-ground); color: var(--fd-ink); font-family: var(--fd-font-text); font-size: 1rem; line-height: 1.55; }
::selection { background: var(--fd-accent); color: var(--fd-ground); }
:focus-visible { outline: 2px solid var(--fd-accent); outline-offset: 3px; }

.fd-demo-intro { padding: clamp(2.5rem, 10vh, 6rem) clamp(1rem, 5vw, 4rem) 60vh; }
.fd-demo-intro h2 { font-family: var(--fd-font-display); font-weight: 400; font-size: clamp(2.5rem, 6vw, 5rem); line-height: 1; letter-spacing: -0.02em; margin: 0 0 1rem; max-width: 14ch; }
.fd-demo-intro p { margin: 0; color: var(--fd-muted); max-width: 46ch; }
.fd-demo-after { padding: 4rem clamp(1rem, 5vw, 4rem) 35vh; color: var(--fd-muted); }

/* ---- snippet: stroke-draw ---- */
.fd-draw { margin: 0; padding: 0 clamp(1rem, 5vw, 4rem); view-timeline: --fd-draw block; }
.fd-draw figcaption { font-size: 0.875rem; color: var(--fd-muted); margin-bottom: 1rem; }
.fd-draw-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(14rem, 1fr); gap: clamp(1.5rem, 4vw, 4rem); align-items: center; max-width: 76rem; }
.fd-draw svg { display: block; width: 100%; height: auto; overflow: visible; }
.fd-stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
.fd-part { stroke: var(--fd-ink); stroke-width: 2.25; }
.fd-dim { stroke: var(--fd-muted); stroke-width: 1.25; }
.fd-lead { stroke: var(--fd-accent); stroke-width: 1.5; }
.fd-draw text { font-family: var(--fd-font-text); font-size: 17px; fill: var(--fd-muted); font-variant-numeric: tabular-nums; }
.fd-draw .fd-mark circle { fill: var(--fd-ground); stroke: var(--fd-accent); stroke-width: 1.5; }
.fd-draw .fd-mark text { fill: var(--fd-accent); font-weight: 600; }
.fd-notes { list-style: none; margin: 0; padding: 0; counter-reset: note; }
.fd-notes li { counter-increment: note; display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 0.25rem; padding: 0.9rem 0; border-top: 1px solid color-mix(in srgb, var(--fd-ink) 18%, var(--fd-ground)); }
.fd-notes li::before { content: counter(note); color: var(--fd-accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.fd-notes b { display: block; font-weight: 600; }
.fd-notes span { color: var(--fd-muted); font-size: 0.875rem; }

/* Armed start state. The script sets data-armed only when motion is allowed. */
.fd-draw[data-armed] .fd-stroke { stroke-dashoffset: 1; }
.fd-draw[data-armed] .fd-note { opacity: 0; transform: translateY(0.5rem); }

@supports (animation-timeline: view()) {
  .fd-draw[data-armed] .fd-stroke {
    animation: fd-draw-in linear both;
    animation-timeline: --fd-draw;
    animation-range: cover var(--a) cover var(--b);
  }
  .fd-draw[data-armed] .fd-note {
    animation: fd-note-in linear both;
    animation-timeline: --fd-draw;
    animation-range: cover var(--a) cover var(--b);
  }
}
@keyframes fd-draw-in { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fd-note-in { from { opacity: 0; transform: translateY(0.5rem); } to { opacity: 1; transform: none; } }

@media (max-width: 760px) {
  .fd-draw-grid { grid-template-columns: minmax(0, 1fr); }
  .fd-draw text { font-size: 22px; }
  .fd-draw .fd-mark text { font-size: 17px; }
}

@media (prefers-reduced-motion: reduce) {
  .fd-draw[data-armed] .fd-stroke { animation: none; stroke-dashoffset: 0; }
  .fd-draw[data-armed] .fd-note { animation: none; opacity: 1; transform: none; }
}
/* ---- end snippet ---- */
</style>
</head>
<body>
<main>
  <div class="fd-demo-intro">
    <h2>Every part, drawn to size.</h2>
    <p>Demo copy. Scroll: the drawing below traces itself in as it arrives.</p>
  </div>

  <!-- snippet: stroke-draw -->
  <figure class="fd-draw" data-fd-draw>
    <figcaption>Illustration. Dimensions are examples, in millimetres.</figcaption>
    <div class="fd-draw-grid">
      <svg viewBox="0 70 560 320" role="img" aria-label="Side view of the case with three numbered parts">
        <!-- structure -->
        <path class="fd-stroke fd-part" pathLength="1" style="--a: 6%; --b: 24%" d="M60 140 Q60 120 80 120 H380 Q400 120 400 140 V300 Q400 320 380 320 H80 Q60 320 60 300 Z"/>
        <path class="fd-stroke fd-part" pathLength="1" style="--a: 16%; --b: 27%" d="M180 120 V100 Q180 84 196 84 H264 Q280 84 280 100 V120"/>
        <path class="fd-stroke fd-part" pathLength="1" style="--a: 18%; --b: 28%" d="M60 170 H400"/>
        <!-- detail -->
        <path class="fd-stroke fd-part" pathLength="1" style="--a: 22%; --b: 31%" d="M140 170 V320 M320 170 V320 M60 252 H400"/>
        <path class="fd-stroke fd-part" pathLength="1" style="--a: 25%; --b: 32%" d="M214 158 H246 V188 H214 Z M230 188 V198"/>
        <path class="fd-stroke fd-part" pathLength="1" style="--a: 26%; --b: 33%" d="M92 320 V336 H130 V320 M330 320 V336 H368 V320"/>
        <!-- dimensions -->
        <path class="fd-stroke fd-dim" pathLength="1" style="--a: 30%; --b: 37%" d="M60 362 H198 M262 362 H400 M60 352 V372 M400 352 V372"/>
        <path class="fd-stroke fd-dim" pathLength="1" style="--a: 31%; --b: 38%" d="M24 120 V198 M24 244 V320 M14 120 H34 M14 320 H34"/>
        <text x="230" y="368" text-anchor="middle">420</text>
        <text x="24" y="227" text-anchor="middle">260</text>
        <!-- callout leaders -->
        <path class="fd-stroke fd-lead" pathLength="1" style="--a: 34%; --b: 39%" d="M394 170 H468"/>
        <path class="fd-stroke fd-lead" pathLength="1" style="--a: 36%; --b: 41%" d="M246 176 L320 228 H468"/>
        <path class="fd-stroke fd-lead" pathLength="1" style="--a: 38%; --b: 43%" d="M368 330 L420 292 H468"/>
        <g class="fd-mark" aria-hidden="true"><circle cx="486" cy="170" r="14"/><text x="486" y="176" text-anchor="middle">1</text></g>
        <g class="fd-mark" aria-hidden="true"><circle cx="486" cy="228" r="14"/><text x="486" y="234" text-anchor="middle">2</text></g>
        <g class="fd-mark" aria-hidden="true"><circle cx="486" cy="292" r="14"/><text x="486" y="298" text-anchor="middle">3</text></g>
      </svg>
      <ol class="fd-notes">
        <li class="fd-note" style="--a: 37%; --b: 41%"><div><b>Lid seals on a gasket</b><span>Example note. Name the real part.</span></div></li>
        <li class="fd-note" style="--a: 39%; --b: 43%"><div><b>Latch takes a padlock</b><span>Example note. Name the real part.</span></div></li>
        <li class="fd-note" style="--a: 41%; --b: 45%"><div><b>Feet keep it off a wet floor</b><span>Example note. Name the real part.</span></div></li>
      </ol>
    </div>
  </figure>
  <!-- end snippet -->

  <p class="fd-demo-after">Demo spacer. Keep about a third of a screen below the figure.</p>
</main>

<script>
/* ---- snippet: stroke-draw ---- */
(function () {
  var fig = document.querySelector('[data-fd-draw]');
  if (!fig || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fig.setAttribute('data-armed', '');
  if (window.CSS && CSS.supports('animation-timeline: view()')) return; // CSS does the rest

  // Fallback: the same "cover" mapping, driven by scroll.
  var items = Array.prototype.map.call(fig.querySelectorAll('[style*="--a"]'), function (el) {
    var cs = getComputedStyle(el);
    return { el: el, a: parseFloat(cs.getPropertyValue('--a')) / 100, b: parseFloat(cs.getPropertyValue('--b')) / 100, path: el.tagName.toLowerCase() === 'path' };
  });
  var queued = false;
  function update() {
    queued = false;
    var r = fig.getBoundingClientRect();
    var p = (innerHeight - r.top) / (innerHeight + r.height); // cover progress
    items.forEach(function (it) {
      var q = Math.min(1, Math.max(0, (p - it.a) / (it.b - it.a)));
      if (it.path) it.el.style.strokeDashoffset = String(1 - q);
      else { it.el.style.opacity = String(q); it.el.style.transform = 'translateY(' + (1 - q) * 0.5 + 'rem)'; }
    });
  }
  function queue() { if (!queued) { queued = true; requestAnimationFrame(update); } }
  addEventListener('scroll', queue, { passive: true });
  addEventListener('resize', queue);
  update();
})();
/* ---- end snippet ---- */
</script>
</body>
</html>
