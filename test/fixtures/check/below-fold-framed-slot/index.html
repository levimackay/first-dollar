<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Framed slot in a padded figure</title>
<style>
body{margin:0;font:16px sans-serif;color:#111;background:#fff}
h1{margin:20px;font-size:32px}
.space{height:1500px}
.ph-defs{position:absolute}
.ph-defs line{stroke:#999;stroke-width:1}
.wrap{margin:0;padding:0 64px}
.frame{position:relative;overflow:clip;height:250px;max-width:40rem;background:#eee}
.plate{position:absolute;inset:-4% 0}
.plate svg{display:block;width:100%;height:100%}
.chip{position:absolute;left:12px;bottom:12px;margin:0;padding:4px 8px;background:#fff}
[data-commitment]{display:inline-block;margin:16px;padding:12px;background:#0b5;color:#000}
</style></head><body>
<svg class="ph-defs" width="0" height="0" aria-hidden="true"><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" /></pattern></defs></svg>
<h1>Visit the workshop</h1>
<a data-commitment href="#join">Join</a>
<div class="space"></div>
<figure class="wrap"><div class="frame"><div class="plate"><svg class="ph-hatch" aria-hidden="true"><rect width="100%" height="100%" fill="url(#hatch)" /></svg></div><p class="chip">[PLACEHOLDER: the bench at noon, 16:9]</p></div><figcaption>The bench where each order is cut.</figcaption></figure>
</body></html>
